name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (biome)
        run: npm run check

      - name: Typecheck
        run: npm run check:types

      # The registration test spins an in-process nats-server; fetch the
      # pinned binary once per job (same version the agent repo's CI uses).
      - name: Fetch nats-server
        run: |
          curl -fsSL -o /tmp/nats.tgz \
            https://github.com/nats-io/nats-server/releases/download/v2.14.6/nats-server-v2.14.6-linux-amd64.tar.gz
          mkdir -p "$HOME/.local/nats/bin"
          tar -xzf /tmp/nats.tgz -C "$HOME/.local/nats/bin" --strip-components=1 \
            nats-server-v2.14.6-linux-amd64/nats-server
          echo "ABC_NATS_SERVER_BIN=$HOME/.local/nats/bin/nats-server" >> "$GITHUB_ENV"

      - name: Unit tests
        run: npm test
